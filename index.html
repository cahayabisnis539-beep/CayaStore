<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAYA Store - Premium Gaming IDs</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library 3D & Animasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body>
    <!-- Canvas untuk Background 3D Kristal -->
    <canvas id="bg-canvas"></canvas>

    <!-- Navbar & Logo 3D -->
    <nav>
        <div class="logo-3d">CAYA<span>.</span></div>
        <!-- Tombol Rahasia Admin -->
        <button id="btn-admin">⚙️ Admin</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Premium<br><span>Gaming ID</span></h1>
        <p class="hero-sub">Kualitas Terjamin, Proses Kilat.</p>
    </section>

    <!-- Panel Admin (Tersembunyi) -->
    <section id="admin-panel">
        <h2>Tambah Produk Baru</h2>
        <input type="text" id="input-nama" placeholder="Nama Produk (Cth: ID FF Rapi)">
        <input type="number" id="input-harga" placeholder="Harga (Angka saja, Cth: 5000)">
        <button id="btn-simpan">Simpan Produk</button>
        <br><br>
        <button id="btn-reset">Hapus Semua Produk</button>
    </section>

    <!-- Product Grid -->
    <section class="product-section">
        <div class="grid-container" id="product-list">
            <!-- Card produk akan otomatis di-generate oleh JavaScript -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
